name: Android APK

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  rust-gate:
    name: Shared Rust quality gate
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      toolchain: "1.95.0"
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 120
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libasound2-dev

  apk:
    name: Build and test FCDroid APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify upstream version and lockfile
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert version == '0.18.0', version
          packages = tomllib.loads(Path('Cargo.lock').read_text())['package']
          engine = [p for p in packages if p['name'] == 'filmcraft' or p['name'].startswith('filmcraft-')]
          assert engine and all(p['version'] == version for p in engine)
          PY
      - name: Gesture, navigation and real-browser regressions
        run: |
          node apps/filmcraft-web/tests/touch.mjs
          node apps/filmcraft-web/tests/phone.mjs
          node apps/filmcraft-web/tests/android-browser.mjs --chrome google-chrome
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Bounded native export regressions
        run: |
          mkdir -p target/android-java-tests
          javac -d target/android-java-tests packaging/android/app/src/main/java/io/github/itsnold/fcdroid/ExportStore.java packaging/android/tests/ExportStoreTest.java
          java -ea -cp target/android-java-tests io.github.itsnold.fcdroid.ExportStoreTest
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install checksum-pinned Gradle distribution
        # Avoid the version-metadata API's 504s; verify the official distribution before use.
        run: |
          archive="$RUNNER_TEMP/gradle-8.13-bin.zip"
          # Gradle's release URL currently returns 504/rate limits; a mirror supplies
          # the same archive, verified below against Gradle's official SHA-256.
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 https://mirrors.huaweicloud.com/gradle/gradle-8.13-bin.zip -o "$archive"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/fcdroid-gradle"
          echo "$RUNNER_TEMP/fcdroid-gradle/gradle-8.13/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Lint Android shell before compiling WASM
        run: gradle -p packaging/android :app:lintDebug -x :app:bundleEditor --stacktrace
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: fcdroid-wasm
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - name: Install exact WASM binding tool
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build editor from this checkout
        run: cargo xtask web
      - name: Compiled editor phone smoke test
        run: node apps/filmcraft-web/tests/android-browser.mjs --chrome google-chrome --dist target/web/dist
      - name: WebGL 4096-texture compatibility
        run: node apps/filmcraft-web/tests/android-browser.mjs --chrome google-chrome --dist target/web/dist --webgl-4096
      - name: Assemble testing APK
        run: gradle -p packaging/android :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verify APK and checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging packaging/android/app/build/outputs/apk/debug/app-debug.apk > target/android-badging.txt
          grep -F "package: name='io.github.itsnold.fcdroid' versionCode='2' versionName='0.1.1-alpha'" target/android-badging.txt
          grep -F "application-label:'FilmCraft'" target/android-badging.txt
          unzip -l packaging/android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/editor/filmcraft_web_bg.wasm'
          cd packaging/android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fcdroid-android-debug
          path: |
            packaging/android/app/build/outputs/apk/debug/app-debug.apk
            packaging/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Assemble non-debuggable unsigned release candidate
        run: gradle -p packaging/android :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify unsigned release candidate
        run: |
          apk=packaging/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > target/android-release-badging.txt
          grep -F "package: name='io.github.itsnold.fcdroid' versionCode='2' versionName='0.1.1-alpha'" target/android-release-badging.txt
          grep -F "application-label:'FilmCraft'" target/android-release-badging.txt
          if grep -q 'application-debuggable' target/android-release-badging.txt; then echo 'Refusing debuggable release'; exit 1; fi
          unzip -l "$apk" | grep 'assets/editor/filmcraft_web_bg.wasm'
      - uses: actions/upload-artifact@v4
        with:
          name: filmcraft-android-unsigned-release
          path: packaging/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fcdroid-test-reports
          path: |
            target/android-smoke/
            target/android-badging.txt
            packaging/android/app/build/reports/
          if-no-files-found: ignore

  sign-release:
    name: Sign and verify FilmCraft release candidate
    needs: [apk, rust-gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: filmcraft-android-unsigned-release
          path: candidate
      - name: Sign and verify the existing release certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KS_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS" || { echo 'Missing Android signing secrets'; exit 1; }
          umask 077
          key="$RUNNER_TEMP/filmcraft-release.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -p -f 4 candidate/app-release-unsigned.apk candidate/aligned.apk
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out candidate/FilmCraft-Android-0.1.1-alpha.apk candidate/aligned.apk
          "$tools/apksigner" verify --verbose --print-certs candidate/FilmCraft-Android-0.1.1-alpha.apk > candidate/signature.txt
          cat candidate/signature.txt
          grep -iF 'Signer #1 certificate SHA-256 digest: cd144e25c7f81c264c2e47035c4bc4f69f3520540957809b77d2ab3d4c232098' candidate/signature.txt
          "$tools/aapt" dump badging candidate/FilmCraft-Android-0.1.1-alpha.apk > candidate/badging.txt
          grep -F "package: name='io.github.itsnold.fcdroid' versionCode='2' versionName='0.1.1-alpha'" candidate/badging.txt
          grep -F "application-label:'FilmCraft'" candidate/badging.txt
          if grep -q 'application-debuggable' candidate/badging.txt; then echo 'Refusing debuggable release'; exit 1; fi
          cd candidate
          sha256sum FilmCraft-Android-0.1.1-alpha.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: filmcraft-android-signed-release
          path: |
            candidate/FilmCraft-Android-0.1.1-alpha.apk
            candidate/SHA256SUMS.txt
            candidate/signature.txt
          if-no-files-found: error
          retention-days: 30
